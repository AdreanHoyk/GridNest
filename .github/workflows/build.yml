name: Build GridNest
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: ./Build.ps1
      - name: Package
        shell: powershell
        run: Compress-Archive -Path GridNest.exe,app.ico,Install.ps1,README.txt,LICENSE.txt -DestinationPath GridNest.zip
      - name: Build EXE installer
        shell: powershell
        run: ./Build-Setup.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GridNest-Windows
          path: |
            GridNest.zip
            GridNest-Setup.exe
      - name: Publish versioned release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $PWD 'GridNest.exe')).FileVersion -replace '\.0$', ''
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $tag GridNest.zip GridNest-Setup.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --notes-file RELEASE_NOTES.md --title "GridNest $version"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

name: Build GridNest
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: ./Build.ps1
      - name: Package
        shell: powershell
        run: Compress-Archive -Path GridNest.exe,app.ico,Install.ps1,README.txt,LICENSE.txt -DestinationPath GridNest.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GridNest-Windows
          path: GridNest.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' GridNest.zip --generate-notes --title 'GridNest ${{ github.ref_name }}'
